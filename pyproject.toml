[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutradar"
version = "0.1.0"
description = "Flag football players performing well relative to their position, minutes and club profile — before the hype."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anayo Chibuike Anyafulu" }]
# Deliberately thin: Step 1 (scoring maths) needs pandas only. scikit-learn
# arrives with the anomaly layer (Isolation Forest) as an optional extra.
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
scout-radar = "scoutradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
